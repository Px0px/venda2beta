<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lojinha de Trocas Minecraft</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Minecraft Style -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .font-minecraft-title {
            font-family: 'Press Start 2P', cursive;
        }
        .font-minecraft {
            font-family: 'VT323', monospace;
        }
        
        .mc-button {
            box-shadow: inset -4px -4px 0px 0px #2a2a2a, inset 4px 4px 0px 0px #ffffff;
            border: 2px solid #000;
        }
        .mc-button:active {
            box-shadow: inset 4px 4px 0px 0px #2a2a2a, inset -4px -4px 0px 0px #ffffff;
        }
        .mc-button-green {
            background-color: #55aa55;
            box-shadow: inset -4px -4px 0px 0px #226622, inset 4px 4px 0px 0px #aaffaa;
        }
        .mc-button-green:hover { background-color: #449944; }
        .mc-button-red {
            background-color: #ff5555;
            box-shadow: inset -4px -4px 0px 0px #992222, inset 4px 4px 0px 0px #ffaaaa;
        }
        .mc-button-red:hover { background-color: #dd4444; }
        
        .mc-panel {
            background-color: #c6c6c6;
            border: 4px solid #000;
            box-shadow: inset -4px -4px 0px 0px #555555, inset 4px 4px 0px 0px #ffffff;
        }
        
        .mc-panel-dark {
            background-color: #212121;
            border: 4px solid #373737;
            box-shadow: inset -4px -4px 0px 0px #111111, inset 4px 4px 0px 0px #555555;
        }

        .mc-input {
            background-color: #000;
            color: #fff;
            border: 2px solid #a0a0a0;
            box-shadow: inset 2px 2px 0px 0px #555;
        }
        .mc-input:focus {
            border-color: #55ff55;
            outline: none;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #555; border: 2px solid #000; }
    </style>
</head>
<body class="bg-stone-900 text-white min-h-screen font-minecraft selection:bg-green-600 selection:text-white">

    <!-- LOGIN MODAL -->
    <div id="login-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="mc-panel w-full max-w-md p-6 text-black relative">
            <h2 class="font-minecraft-title text-xl text-center mb-6 text-gray-900 tracking-wider">ENTRAR NA LOJA</h2>
            
            <div class="flex border-b-2 border-black mb-6">
                <button id="tab-guest-btn" onclick="switchLoginTab('guest')" class="flex-1 py-2 font-minecraft-title text-xs bg-gray-400 border-t-2 border-l-2 border-r-2 border-black">
                    Convidado
                </button>
                <button id="tab-admin-btn" onclick="switchLoginTab('admin')" class="flex-1 py-2 font-minecraft-title text-xs bg-gray-300 border-b-2 border-black">
                    Admin
                </button>
            </div>

            <!-- Form Convidado -->
            <div id="form-guest" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold mb-1">Seu Nick no Minecraft:</label>
                    <input type="text" id="guest-username" placeholder="Ex: Steve_Craft" class="w-full p-2 mc-input text-lg">
                </div>
                <button onclick="loginAsGuest()" class="w-full py-3 mc-button mc-button-green text-white font-minecraft-title text-sm tracking-wider">
                    ENTRAR COMO CONVIDADO
                </button>
            </div>

            <!-- Form Admin -->
            <div id="form-admin" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-bold mb-1">Usuário Administrador:</label>
                    <input type="text" id="admin-user" placeholder="Usuário" class="w-full p-2 mc-input text-lg">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Senha:</label>
                    <input type="password" id="admin-pass" placeholder="••••••••" class="w-full p-2 mc-input text-lg">
                </div>
                <div id="admin-error" class="text-red-600 text-sm font-bold hidden">
                    Usuário ou senha incorretos!
                </div>
                <button onclick="loginAsAdmin()" class="w-full py-3 mc-button mc-button-green text-white font-minecraft-title text-sm tracking-wider">
                    ACESSAR COMO ADMIN
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app-container" class="opacity-30 pointer-events-none transition-all duration-300">
        <!-- HEADER -->
        <header class="bg-stone-800 border-b-4 border-black p-4 sticky top-0 z-40">
            <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <span class="text-3xl">⛏️</span>
                    <div>
                        <h1 class="font-minecraft-title text-xl text-yellow-400 tracking-wider">LOJA DE TROCAS</h1>
                        <p class="text-xs text-gray-400">Troque seus itens do Minecraft com facilidade!</p>
                    </div>
                </div>

                <div class="flex items-center gap-4">
                    <!-- Status do Banco de Dados -->
                    <div id="db-status-badge" class="px-3 py-1 bg-green-900/80 border border-green-500 text-green-200 text-xs rounded flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-green-400"></span>
                        <span>Supabase Conectado</span>
                    </div>

                    <!-- User Profile Info -->
                    <div id="user-info-bar" class="flex items-center gap-3 bg-stone-900 p-2 px-3 border-2 border-stone-600">
                        <span id="user-badge" class="font-minecraft-title text-xs text-green-400">---</span>
                        <button onclick="logout()" class="mc-button mc-button-red text-xs px-2 py-1 text-white font-bold">
                            SAIR
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- NAVIGATION TABS -->
        <div class="max-w-6xl mx-auto px-4 mt-6">
            <div class="flex border-b-4 border-black gap-2">
                <button id="nav-catalog" onclick="switchMainTab('catalog')" class="py-2 px-6 font-minecraft-title text-xs bg-stone-700 text-yellow-400 border-t-4 border-l-4 border-r-4 border-black">
                    🛒 Catálogo
                </button>
                <button id="nav-orders" onclick="switchMainTab('orders')" class="py-2 px-6 font-minecraft-title text-xs bg-stone-800 text-gray-400 border-t-4 border-l-4 border-r-4 border-black">
                    📦 Pedidos <span id="orders-count" class="bg-yellow-500 text-black px-1 rounded text-xs ml-1">0</span>
                </button>
                <button id="nav-admin" onclick="switchMainTab('admin')" class="py-2 px-6 font-minecraft-title text-xs bg-stone-800 text-gray-400 border-t-4 border-l-4 border-r-4 border-black hidden">
                    ⚙️ Painel Admin
                </button>
            </div>
        </div>

        <!-- MAIN CONTENT AREA -->
        <main class="max-w-6xl mx-auto p-4">
            
            <!-- SECTION 1: CATALOGO -->
            <section id="section-catalog" class="space-y-6">
                <div class="mc-panel-dark p-4 flex flex-col md:flex-row gap-4 justify-between items-center">
                    <div class="w-full md:w-1/2">
                        <input type="text" id="search-input" oninput="renderCatalog()" placeholder="Buscar item..." class="w-full p-2 mc-input text-lg">
                    </div>
                    <div class="flex gap-2 w-full md:w-auto">
                        <select id="filter-category" onchange="renderCatalog()" class="p-2 mc-input text-lg bg-black text-white w-full">
                            <option value="all">Todas Categorias</option>
                            <option value="Recursos">Recursos</option>
                            <option value="Equipamentos">Equipamentos</option>
                            <option value="Blocos">Blocos</option>
                            <option value="Comida/Poções">Comida/Poções</option>
                        </select>
                    </div>
                </div>

                <div id="catalog-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </section>

            <!-- SECTION 2: PEDIDOS -->
            <section id="section-orders" class="space-y-6 hidden">
                <div class="mc-panel-dark p-6">
                    <h2 class="font-minecraft-title text-lg text-yellow-400 mb-4">ACOMPANHAMENTO DE PEDIDOS</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b-2 border-stone-700 text-yellow-400 font-minecraft-title text-xs">
                                    <th class="p-3">#ID</th>
                                    <th class="p-3">Cliente</th>
                                    <th class="p-3">Produto</th>
                                    <th class="p-3">Qtd</th>
                                    <th class="p-3">Pagamento (Troca)</th>
                                    <th class="p-3">Status</th>
                                    <th class="p-3 text-right" id="th-actions">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="orders-table-body" class="divide-y divide-stone-800 text-lg"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- SECTION 3: PAINEL ADMIN -->
            <section id="section-admin" class="space-y-6 hidden">
                <div class="mc-panel p-6 text-black">
                    <h2 class="font-minecraft-title text-lg mb-4 text-stone-900">ADICIONAR / EDITAR PRODUTO</h2>
                    <form id="product-form" onsubmit="handleSaveProduct(event)" class="space-y-4">
                        <input type="hidden" id="prod-id">
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-bold mb-1">Nome do Item a Vender:</label>
                                <input type="text" id="prod-nome" required placeholder="Ex: Armadura de Diamante" class="w-full p-2 mc-input text-lg">
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-1">Categoria:</label>
                                <select id="prod-categoria" class="w-full p-2 mc-input text-lg bg-black text-white">
                                    <option value="Recursos">Recursos</option>
                                    <option value="Equipamentos">Equipamentos</option>
                                    <option value="Blocos">Blocos</option>
                                    <option value="Comida/Poções">Comida/Poções</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-bold mb-1">Ícone / Emoji / URL Imagem:</label>
                                <input type="text" id="prod-imagem" required placeholder="Ex: 📦 ou URL" class="w-full p-2 mc-input text-lg">
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-1">Descrição do Preço (Troca):</label>
                                <input type="text" id="prod-preco-desc" required placeholder="Ex: 2 packs e meio de carne" class="w-full p-2 mc-input text-lg">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-bold mb-1">Estoque Inicial:</label>
                            <input type="number" id="prod-estoque" required min="0" placeholder="Ex: 64" class="w-full p-2 mc-input text-lg">
                        </div>

                        <div class="flex gap-4 pt-2">
                            <button type="submit" id="save-prod-btn" class="flex-1 py-3 mc-button mc-button-green text-white font-minecraft-title text-xs">
                                SALVAR PRODUTO NO SUPABASE
                            </button>
                            <button type="button" onclick="resetProductForm()" class="py-3 px-6 mc-button bg-gray-500 text-white font-minecraft-title text-xs">
                                LIMPAR
                            </button>
                        </div>
                    </form>
                </div>
            </section>

        </main>
    </div>

    <!-- MODAL FAZER PEDIDO -->
    <div id="order-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="mc-panel w-full max-w-md p-6 text-black relative">
            <button onclick="closeOrderModal()" class="absolute top-2 right-2 font-minecraft-title text-red-600 font-bold text-lg">X</button>
            <h2 class="font-minecraft-title text-lg text-center mb-4 text-stone-900">FAZER PEDIDO</h2>
            
            <div id="order-modal-details" class="bg-gray-300 p-3 mb-4 border-2 border-black text-sm"></div>

            <form onsubmit="submitOrder(event)" class="space-y-4">
                <input type="hidden" id="order-prod-id">
                <div>
                    <label class="block text-sm font-bold mb-1">Quantidade Desejada:</label>
                    <input type="number" id="order-qtd" value="1" min="1" class="w-full p-2 mc-input text-lg">
                </div>

                <button type="submit" id="submit-order-btn" class="w-full py-3 mc-button mc-button-green text-white font-minecraft-title text-xs">
                    CONFIRMAR PEDIDO DE TROCA
                </button>
            </form>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DIRETA DO SUPABASE NO CÓDIGO
        const SUPABASE_URL = "https://jjthqwziyblaknxzlxyq.supabase.co";
        const SUPABASE_KEY = "sb_publishable_-1d4BJMLldRrPXLEXZdCng_iI8bPLit"; // Substitua aqui pela sua chave publishable completa se necessário

        let supabaseClient = null;
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (e) {
            console.error("Erro ao conectar no Supabase:", e);
        }

        // STATE DA APLICAÇÃO
        let currentUser = JSON.parse(localStorage.getItem('mc_user')) || null;
        let products = [];
        let orders = [];

        window.onload = function() {
            if (currentUser) {
                initApp();
            } else {
                document.getElementById('login-modal').classList.remove('hidden');
            }
        };

        // LOGIN / LOGOUT LOGIC
        function switchLoginTab(tab) {
            const guestBtn = document.getElementById('tab-guest-btn');
            const adminBtn = document.getElementById('tab-admin-btn');
            const formGuest = document.getElementById('form-guest');
            const formAdmin = document.getElementById('form-admin');

            if (tab === 'guest') {
                guestBtn.className = "flex-1 py-2 font-minecraft-title text-xs bg-gray-400 border-t-2 border-l-2 border-r-2 border-black";
                adminBtn.className = "flex-1 py-2 font-minecraft-title text-xs bg-gray-300 border-b-2 border-black";
                formGuest.classList.remove('hidden');
                formAdmin.classList.add('hidden');
            } else {
                adminBtn.className = "flex-1 py-2 font-minecraft-title text-xs bg-gray-400 border-t-2 border-l-2 border-r-2 border-black";
                guestBtn.className = "flex-1 py-2 font-minecraft-title text-xs bg-gray-300 border-b-2 border-black";
                formAdmin.classList.remove('hidden');
                formGuest.classList.add('hidden');
            }
        }

        function loginAsGuest() {
            const nick = document.getElementById('guest-username').value.trim();
            if (!nick) return alert("Digite seu nick no Minecraft!");
            currentUser = { role: 'guest', name: nick };
            localStorage.setItem('mc_user', JSON.stringify(currentUser));
            initApp();
        }

        function loginAsAdmin() {
            const user = document.getElementById('admin-user').value.trim();
            const pass = document.getElementById('admin-pass').value.trim();

            if (user === 'Pedro44247474' && pass === 'Pedro44247474@') {
                currentUser = { role: 'admin', name: 'Pedro (Admin)' };
                localStorage.setItem('mc_user', JSON.stringify(currentUser));
                document.getElementById('admin-error').classList.add('hidden');
                initApp();
            } else {
                document.getElementById('admin-error').classList.remove('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('mc_user');
            currentUser = null;
            location.reload();
        }

        function initApp() {
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('app-container').classList.remove('opacity-30', 'pointer-events-none');
            document.getElementById('user-badge').innerText = `${currentUser.name} (${currentUser.role.toUpperCase()})`;

            if (currentUser.role === 'admin') {
                document.getElementById('nav-admin').classList.remove('hidden');
            }

            loadData();
        }

        // CARREGAR DADOS DO SUPABASE
        async function loadData() {
            if (!supabaseClient) return;

            try {
                // Fetch produtos
                const { data: prodData, error: prodErr } = await supabaseClient
                    .from('produtos')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (!prodErr && prodData) products = prodData;

                // Fetch pedidos
                const { data: ordData, error: ordErr } = await supabaseClient
                    .from('pedidos')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (!ordErr && ordData) orders = ordData;

                // Realtime Subscriptions
                supabaseClient.channel('realtime_shop')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'produtos' }, () => loadData())
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, () => loadData())
                    .subscribe();

            } catch (err) {
                console.error("Erro ao carregar do Supabase:", err);
            }

            document.getElementById('orders-count').innerText = orders.length;
            renderCatalog();
            renderOrders();
        }

        // RENDER CATÁLOGO
        function renderCatalog() {
            const grid = document.getElementById('catalog-grid');
            const search = document.getElementById('search-input').value.toLowerCase();
            const category = document.getElementById('filter-category').value;

            grid.innerHTML = '';

            const filtered = products.filter(p => {
                const itemName = (p.name || '').toLowerCase();
                const itemCat = p.category || '';
                const matchSearch = itemName.includes(search);
                const matchCat = category === 'all' || itemCat === category;
                return matchSearch && matchCat;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center text-gray-400 py-10 font-minecraft-title text-sm">Nenhum item encontrado no estoque!</div>`;
                return;
            }

            filtered.forEach(p => {
                const iconStr = p.icon || '📦';
                const isEmoji = iconStr.length <= 4;
                const imgHtml = isEmoji 
                    ? `<span class="text-5xl select-none">${iconStr}</span>` 
                    : `<img src="${iconStr}" class="w-16 h-16 object-contain" alt="${p.name}">`;

                const isAdmin = currentUser && currentUser.role === 'admin';
                const stockQty = p.stock !== undefined ? p.stock : 0;

                grid.innerHTML += `
                    <div class="mc-panel-dark p-4 flex flex-col justify-between relative group">
                        ${isAdmin ? `
                            <div class="absolute top-2 right-2 flex gap-1">
                                <button onclick="editProduct('\${p.id}')" class="bg-blue-600 text-white text-xs px-2 py-1 font-bold rounded">✏️</button>
                                <button onclick="deleteProduct('\${p.id}')" class="bg-red-600 text-white text-xs px-2 py-1 font-bold rounded">🗑️</button>
                            </div>
                        ` : ''}
                        
                        <div>
                            <div class="bg-stone-900 border-2 border-stone-700 h-28 flex items-center justify-center mb-3">
                                ${imgHtml}
                            </div>
                            <span class="text-xs bg-stone-800 text-yellow-500 px-2 py-0.5 rounded border border-stone-700">${p.category || 'Geral'}</span>
                            <h3 class="font-minecraft-title text-sm text-white mt-2">${p.name}</h3>
                            
                            <div class="mt-3 p-2 bg-black/40 border border-stone-800 text-xs space-y-1">
                                <p class="text-gray-300">Custa: <span class="text-green-400 font-bold">${p.price_description || 'A combinar'}</span></p>
                                <p class="text-gray-400">Estoque: <span class="${stockQty > 0 ? 'text-white' : 'text-red-500 font-bold'}">${stockQty} unidades</span></p>
                            </div>
                        </div>

                        <button onclick="openOrderModal('${p.id}')" ${stockQty <= 0 ? 'disabled' : ''} 
                            class="mt-4 w-full py-2 mc-button ${stockQty > 0 ? 'mc-button-green text-white' : 'bg-gray-600 text-gray-400 cursor-not-allowed'} font-minecraft-title text-xs">
                            ${stockQty > 0 ? 'TROCAR ITEM' : 'SEM ESTOQUE'}
                        </button>
                    </div>
                `;
            });
        }

        // SALVAR PRODUTO (ADMIN)
        async function handleSaveProduct(e) {
            e.preventDefault();
            const btn = document.getElementById('save-prod-btn');
            btn.disabled = true;
            btn.innerText = "SALVANDO...";

            const id = document.getElementById('prod-id').value;
            const name = document.getElementById('prod-nome').value.trim();
            const category = document.getElementById('prod-categoria').value;
            const icon = document.getElementById('prod-imagem').value.trim();
            const price_description = document.getElementById('prod-preco-desc').value.trim();
            const stock = parseInt(document.getElementById('prod-estoque').value);

            const payload = { name, category, icon, price_description, stock };

            if (id) {
                await supabaseClient.from('produtos').update(payload).eq('id', id);
            } else {
                await supabaseClient.from('produtos').insert([payload]);
            }

            resetProductForm();
            switchMainTab('catalog');
            await loadData();

            btn.disabled = false;
            btn.innerText = "SALVAR PRODUTO NO SUPABASE";
            alert("Produto salvo com sucesso!");
        }

        function editProduct(id) {
            const p = products.find(x => String(x.id) === String(id));
            if (!p) return;
            document.getElementById('prod-id').value = p.id;
            document.getElementById('prod-nome').value = p.name;
            document.getElementById('prod-categoria').value = p.category;
            document.getElementById('prod-imagem').value = p.icon;
            document.getElementById('prod-preco-desc').value = p.price_description;
            document.getElementById('prod-estoque').value = p.stock;
            switchMainTab('admin');
        }

        async function deleteProduct(id) {
            if (!confirm("Tem certeza que deseja excluir este produto?")) return;
            await supabaseClient.from('produtos').delete().eq('id', id);
            await loadData();
        }

        function resetProductForm() {
            document.getElementById('prod-id').value = '';
            document.getElementById('product-form').reset();
        }

        // FAZER PEDIDO (CONVIDADO)
        let selectedProductForOrder = null;

        function openOrderModal(prodId) {
            selectedProductForOrder = products.find(p => String(p.id) === String(prodId));
            if (!selectedProductForOrder) return;

            document.getElementById('order-prod-id').value = selectedProductForOrder.id;
            document.getElementById('order-qtd').value = 1;
            document.getElementById('order-qtd').max = selectedProductForOrder.stock;

            document.getElementById('order-modal-details').innerHTML = `
                <p><strong>Item:</strong> ${selectedProductForOrder.name}</p>
                <p><strong>Preço:</strong> ${selectedProductForOrder.price_description}</p>
                <p><strong>Estoque disponível:</strong> ${selectedProductForOrder.stock}</p>
            `;

            document.getElementById('order-modal').classList.remove('hidden');
        }

        function closeOrderModal() {
            document.getElementById('order-modal').classList.add('hidden');
        }

        async function submitOrder(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-order-btn');
            btn.disabled = true;
            btn.innerText = "ENVIANDO PEDIDO...";

            const qtd = parseInt(document.getElementById('order-qtd').value);
            if (qtd > selectedProductForOrder.stock) {
                alert("Quantidade maior do que o estoque disponível!");
                btn.disabled = false;
                return;
            }

            // Insere pedido
            await supabaseClient.from('pedidos').insert([{
                cliente: currentUser.name,
                produto_id: selectedProductForOrder.id,
                produto_nome: selectedProductForOrder.name,
                quantidade: qtd,
                total_pagamento: selectedProductForOrder.price_description,
                status: 'Pendente'
            }]);

            // Atualiza estoque no Supabase
            const novoEstoque = selectedProductForOrder.stock - qtd;
            await supabaseClient.from('produtos').update({ stock: novoEstoque }).eq('id', selectedProductForOrder.id);

            closeOrderModal();
            switchMainTab('orders');
            await loadData();

            btn.disabled = false;
            btn.innerText = "CONFIRMAR PEDIDO DE TROCA";
            alert("Pedido enviado com sucesso!");
        }

        function renderOrders() {
            const tbody = document.getElementById('orders-table-body');
            const thActions = document.getElementById('th-actions');
            tbody.innerHTML = '';

            const isAdmin = currentUser && currentUser.role === 'admin';
            if (!isAdmin) {
                thActions.classList.add('hidden');
            } else {
                thActions.classList.remove('hidden');
            }

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-gray-500">Nenhum pedido realizado ainda.</td></tr>`;
                return;
            }

            orders.forEach(o => {
                let statusColor = 'text-yellow-400';
                if (o.status === 'Concluído') statusColor = 'text-green-400';
                if (o.status === 'Cancelado') statusColor = 'text-red-400';

                tbody.innerHTML += `
                    <tr>
                        <td class="p-3 text-gray-400">#${String(o.id).substring(0, 8)}</td>
                        <td class="p-3 font-bold text-white">${o.cliente}</td>
                        <td class="p-3 text-yellow-300">${o.produto_nome}</td>
                        <td class="p-3">${o.quantidade}</td>
                        <td class="p-3 text-green-300">${o.total_pagamento}</td>
                        <td class="p-3 font-bold ${statusColor}">${o.status}</td>
                        ${isAdmin ? `
                            <td class="p-3 text-right space-x-1">
                                <button onclick="updateOrderStatus('\${o.id}', 'Concluído')" class="bg-green-600 hover:bg-green-700 text-white text-xs px-2 py-1 rounded font-bold">✔</button>
                                <button onclick="updateOrderStatus('\${o.id}', 'Cancelado')" class="bg-red-600 hover:bg-red-700 text-white text-xs px-2 py-1 rounded font-bold">✖</button>
                            </td>
                        ` : ''}
                    </tr>
                `;
            });
        }

        async function updateOrderStatus(orderId, status) {
            await supabaseClient.from('pedidos').update({ status }).eq('id', orderId);
            await loadData();
        }

        // SWITCH TABS
        function switchMainTab(tab) {
            const secCat = document.getElementById('section-catalog');
            const secOrd = document.getElementById('section-orders');
            const secAdm = document.getElementById('section-admin');

            const btnCat = document.getElementById('nav-catalog');
            const btnOrd = document.getElementById('nav-orders');
            const btnAdm = document.getElementById('nav-admin');

            secCat.classList.add('hidden');
            secOrd.classList.add('hidden');
            secAdm.classList.add('hidden');

            btnCat.className = "py-2 px-6 font-minecraft-title text-xs bg-stone-800 text-gray-400 border-t-4 border-l-4 border-r-4 border-black";
            btnOrd.className = "py-2 px-6 font-minecraft-title text-xs bg-stone-800 text-gray-400 border-t-4 border-l-4 border-r-4 border-black";
            btnAdm.className = "py-2 px-6 font-minecraft-title text-xs bg-stone-800 text-gray-400 border-t-4 border-l-4 border-r-4 border-black hidden";
            if (currentUser.role === 'admin') btnAdm.classList.remove('hidden');

            if (tab === 'catalog') {
                secCat.classList.remove('hidden');
                btnCat.className = "py-2 px-6 font-minecraft-title text-xs bg-stone-700 text-yellow-400 border-t-4 border-l-4 border-r-4 border-black";
            } else if (tab === 'orders') {
                secOrd.classList.remove('hidden');
                btnOrd.className = "py-2 px-6 font-minecraft-title text-xs bg-stone-700 text-yellow-400 border-t-4 border-l-4 border-r-4 border-black";
            } else if (tab === 'admin') {
                secAdm.classList.remove('hidden');
                btnAdm.className = "py-2 px-6 font-minecraft-title text-xs bg-stone-700 text-yellow-400 border-t-4 border-l-4 border-r-4 border-black";
            }
        }
    </script>
</body>
</html>
